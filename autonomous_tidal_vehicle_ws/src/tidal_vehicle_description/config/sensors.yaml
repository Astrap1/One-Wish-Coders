# Sensor contract. Update frame names together with the SDF/URDF model
# (both are generated by scripts/gen_description.py from link_frames.json).
base_frame: base_link          # hull link; parent frame: map (see docs/INTERFACES.md)
lidar:
  frame: lidar_link
  points_topic: /points        # 16-channel 3D LiDAR, sensor_msgs/PointCloud2, 10 Hz
  topic: /scan                 # 2D LaserScan derived from /points (pointcloud_to_laserscan)
  update_rate_hz: 10
  height_m: {ground_mode: 0.75, hover_mode: 0.69}
imu:
  frame: imu_link              # coincident with base_link
  topic: /imu
  update_rate_hz: 50
camera:
  frame: camera_link
  topic: /camera/image_raw
  update_rate_hz: 15
gnss:
  frame: base_link
  topic: /gps/fix
  update_rate_hz: 10
