# Vehicle Version 2 (hovercraft_v2): hovercraft-dominant with a retractable
# tracked undercarriage and controlled air-cushion load sharing. Loaded by
# sim.launch.py with vehicle:=v2. These are stated simulation assumptions,
# not measured vehicle data (see AGENTS.md "Vehicle Version 2").
vehicle_mobility:
  ros__parameters:
    use_sim_time: true
    gear: tracks                   # wheels (Version 1) | tracks (Version 2)
    mode_policy: terrain_auto      # HOVER by default; TRACK only for a steep firm-land climb
    cmd_timeout_s: 0.5             # /cmd_vel older than this -> stop
    max_speed_mps: 2.5             # HOVER; top speed is ~3 m/s at 2 x 200 N
    track_max_speed_mps: 1.5       # TRACK
    max_yaw_rate_rps: 1.0
    spinup_s: 2.0                  # lift fan spin-up
    fold_s: 1.5                    # track retract / deploy time (0.25 m at 0.2 m/s)
    transition_timeout_s: 12.0     # stop and report a fault if readiness never arrives
    settle_s: 0.5                  # gap must stay at the on-track height this long
    telemetry_rate_hz: 10.0        # vehicle health and placeholder terrain state
    retract_position: 0.25         # track joint position when retracted (m)
    gear_joints: [track_left_joint, track_right_joint]
    track_share_slope: 0.6         # cushion load share while climbing on tracks
    # Guard band below the physical 15-degree embankment: deploy before the
    # cushion reaches the slope and loses the IMU pitch signal needed to react.
    track_deploy_slope_deg: 14.0   # deploy tracks for a sustained forward climb >= this
    settle_gap_m: 0.03             # skirt gap when the vehicle rests on its tracks
    settle_gap_tolerance_m: 0.008
    slope_dwell_s: 1.5             # climb must persist this long (edges and bumps are brief)
    settle_vz_mps: 0.03            # settled on the tracks once vertical motion stops (uneven ground)
    ground_cmd_topic: /vehicle/cmd_vel_tracks
    gear_cmd_topic: /vehicle/tracks_cmd
    terrain_source: costmap        # mode from the /terrain_costmap bands, looking ahead
    terrain_lookahead_m: 2.5       # half the vehicle length plus stopping distance
    battery_capacity_wh: 10000.0
    initial_battery_percent: 100.0
    idle_w: 150.0                  # computer, sensors, comms
    lift_fan_w: 2500.0             # full lift; scaled by the load share in TRACK mode
    thrust_w_per_n: 15.0           # electrical W per N of ducted-fan thrust
    glide_b1: 50.0                 # hover drag used for the thrust (power) estimate
    glide_b2: 25.0
    wheels_w: 800.0                # track drive power while moving
    mobility_health_percent: 100.0 # fault-injection hooks (ros2 param set ...)
    link_ok: true
    payload_secured: true
    fault: ""
    publish_terrain_state: true    # placeholder; sim.launch.py turns it off when tide_manager runs
    map_frame: map

lidar_scan:
  ros__parameters:
    use_sim_time: true
    bins: 720                      # 0.5 deg
    # Reject the decorative terrain mesh / collision plane. The LiDAR mast is
    # 1.44 m above base_link, so -0.62 m ignores returns in the lowest
    # ~0.82 m. This stops terrain texture/ground returns from filling the
    # 2D obstacle overlay while retaining rocks, trunks and tall root systems.
    min_height_m: -0.62
    max_height_m: 0.50
    range_min_m: 0.3
    range_max_m: 30.0
    self_box_m: [-1.32, 1.30, -0.78, 0.78]   # whole vehicle in lidar_link (LiDAR on the centre mast)

terrain_costmap:
  ros__parameters:
    use_sim_time: true
    frame_id: map
    resolution_m: 0.5
    width_cells: 84
    height_cells: 30
    origin_x_m: -5.0
    origin_y_m: -7.5
    water_start_x_m: 4.0
    water_end_x_m: 12.0
    mud_end_x_m: 22.0
    firm_cost: 10
    water_cost: 30
    mud_cost: 50
    publish_rate_hz: 1.0
