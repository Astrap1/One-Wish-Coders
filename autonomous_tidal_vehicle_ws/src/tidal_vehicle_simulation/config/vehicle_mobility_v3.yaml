# Vehicle Version 3 (hovercraft_v3): Version 2 scaled up for speed (3.0 x 1.8 m,
# 530 kg incl. a 100 kg payload), series-hybrid power, 2 x 470 N ducted fans.
# Loaded by sim.launch.py with vehicle:=v3. These are stated simulation
# assumptions, not measured vehicle data (see AGENTS.md "Vehicle Version 3",
# tools/vehicle_sizing/v3_sizing.py).
vehicle_mobility:
  ros__parameters:
    use_sim_time: true
    gear: tracks                   # retractable tracks, as Version 2
    mode_policy: terrain_auto      # HOVER by default; TRACK only for a steep firm-land climb
    cmd_timeout_s: 0.5             # /cmd_vel older than this -> stop
    max_speed_mps: 13.9            # HOVER, 50 km/h; zone limits below cap it further
    track_max_speed_mps: 4.2       # TRACK, 15 km/h
    max_yaw_rate_rps: 1.0
    # Split cost bands (AGENTS.md): [firm 0-19, open surveyed water 20-29,
    # mud / shallow water / roots / debris 30-59, elevated risk 60-89] in m/s.
    # The node looks ahead as far as it needs to stop, so it slows before a
    # slower zone. Autonomy and Safety apply the same limits.
    zone_speed_limits_mps: [4.2, 13.9, 2.8, 2.8]
    brake_decel_mps2: 1.0          # planning value: reverse thrust gives ~1.5 m/s^2 (sizing); the margin
                                   # covers thrust lag, so the vehicle is slow before it enters a slower zone
    spinup_s: 2.0                  # lift fan spin-up
    fold_s: 1.5                    # track retract / deploy time (0.25 m at 0.2 m/s)
    transition_timeout_s: 12.0     # stop and report a fault if readiness never arrives
    settle_s: 0.5                  # gap must stay at the on-track height this long
    telemetry_rate_hz: 10.0        # vehicle health and placeholder terrain state
    retract_position: 0.25         # track joint position when retracted (m)
    gear_joints: [track_left_joint, track_right_joint]
    track_share_slope: 0.6         # cushion load share while climbing on tracks
    # V3 is hover-capable through 8 degrees and track-capable through 20 degrees.
    # Deploy before the hover margin is exhausted; the 1.5 s dwell rejects bumps.
    track_deploy_slope_deg: 8.0
    settle_gap_m: 0.03             # skirt gap when the vehicle rests on its tracks
    settle_gap_tolerance_m: 0.008
    slope_dwell_s: 1.5             # climb must persist this long (edges and bumps are brief)
    track_exit_slope_deg: 4.0      # leave TRACK once the climb is below this (below the 8 deg deploy) ...
    track_exit_dwell_s: 0.5        # ... for this long (a bump on the bank does not retract)
    settle_vz_mps: 0.03            # settled on the tracks once vertical motion stops (uneven ground)
    ground_cmd_topic: /vehicle/cmd_vel_tracks
    gear_cmd_topic: /vehicle/tracks_cmd
    terrain_source: costmap        # mode from the /terrain_costmap bands, looking ahead
    terrain_lookahead_m: 3.0       # half the vehicle length plus stopping distance at low speed
    # Series hybrid: a ~20 kW diesel generator follows the demand and tops up the
    # 5 kWh buffer battery; fuel_percent is reported on /vehicle_health
    battery_capacity_wh: 5000.0
    initial_battery_percent: 100.0
    fuel_capacity_l: 30.0
    genset_max_w: 20000.0
    idle_w: 300.0                  # computer, sensors (four cameras), comms
    lift_fan_w: 3900.0             # full lift; scaled by the load share in TRACK mode
    thrust_w_per_n: 20.0           # electrical W per N of ducted-fan thrust
    glide_b1: 2.0                  # drag model used for the thrust (power) estimate
    glide_b2: 0.6
    glide_c: 104.0
    wheels_w: 1500.0               # track drive power while moving
    mobility_health_percent: 100.0 # fault-injection hooks (ros2 param set ...)
    link_ok: true
    payload_secured: true
    fault: ""
    publish_terrain_state: true    # placeholder; sim.launch.py turns it off when tide_manager runs
    map_frame: map

lidar_scan:
  ros__parameters:
    use_sim_time: true
    bins: 720                      # 0.5 deg
    # The terrain-relative filter below rejects the slope, so retain the low
    # beams needed to see rocks and roots as well as trunk collision proxies.
    min_height_m: -1.70
    max_height_m: 0.50
    range_min_m: 0.3
    range_max_m: 30.0
    self_box_m: [-1.56, 1.56, -0.95, 0.95]   # inclusive hull/fan bounds in lidar_link
    # The 3.0 x 1.8 m footprint has a 1.75 m half-diagonal.  The extra 0.10 m
    # is required by measured V3 corner returns while retaining obstacles
    # immediately outside the body envelope.
    self_footprint_radius_m: 1.85
    # The corridor terrain is piecewise sloped, so a LiDAR-relative z cutoff
    # alone cannot distinguish an uphill surface from an obstacle.  Transform
    # returns with odometry and require a protrusion above the known surface.
    corridor_ground_filter: true
    lidar_height_m: 1.82
    ground_clearance_m: 0.30
    # Keep the 2D navigation slice within the hull/rock/trunk collision zone.
    # This rejects visual-only mangrove canopy above the vehicle.
    ground_obstacle_height_m: 1.30

terrain_costmap:
  ros__parameters:
    use_sim_time: true
    frame_id: map
    resolution_m: 0.5
    width_cells: 84
    height_cells: 30
    origin_x_m: -5.0
    origin_y_m: -7.5
    water_start_x_m: 4.0
    water_end_x_m: 12.0
    mud_end_x_m: 22.0
    firm_cost: 10
    water_cost: 25                 # the integration channel is open, surveyed water (fast band)
    mud_cost: 50
    publish_rate_hz: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: true
    model_name: hovercraft_v3
    parts: [hull, skirt, track_left, track_right]
    jolt_threshold_mps2: 6.0       # normal braking is ~1.5 m/s^2; a hit is much sharper
    jolt_lowpass_s: 0.5
    repeat_s: 1.0
